name: Deploy Automático na VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vm-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, deploy-vm]
    timeout-minutes: 20
    env:
      APP_PORT: "8080"
      APP_REVISION: ${{ github.sha }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Baixar o código do commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Conferir Docker e configuração
        run: |
          docker --version
          docker compose version
          docker info > /dev/null
          docker compose config --quiet

      - name: Construir imagem e validar PHP
        run: |
          docker compose build --pull
          docker compose run --rm --no-deps app-crud sh -ec '
            php -l /var/www/html/index.php
            php -l /var/www/html/crud-filmes.php
            php -l /var/www/html/health.php
          '

      - name: Atualizar aplicação e aguardar saúde
        run: |
          docker compose up -d --wait --wait-timeout 120
          docker compose ps
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/health.php

      - name: Mostrar diagnóstico em caso de falha
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=100 || true
