name: Deploy Automático na VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Baixar o código atualizado
        uses: actions/checkout@v4

      - name: Reiniciar a aplicação no Docker
        run: |
          docker-compose down
          docker-compose up -d --build