name: trabalho-deploy-vm

services:
  app-crud:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-local}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - sessoes:/var/lib/php/sessions
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health.php') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  sessoes:
